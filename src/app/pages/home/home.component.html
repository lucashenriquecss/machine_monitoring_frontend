<div class="filter-container">
  <mat-form-field appearance="outline">
    <mat-label>Filtrar por nome ou status</mat-label>
    <input matInput [formControl]="statusFilter" (keyup)="applyFilter()" placeholder="Ex.: error, offline">
  </mat-form-field>
  <button mat-raised-button color="primary" (click)="openAddMachineModal()">Adicionar Nova</button>
</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let element"> {{ element.id }} </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Nome </th>
    <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> Status </th>
    <td mat-cell *matCellDef="let element"> {{ element.status }} </td>
  </ng-container>

  <ng-container matColumnDef="location">
    <th mat-header-cell *matHeaderCellDef> Localização </th>
    <td mat-cell *matCellDef="let element"> {{ element.location }} </td>
  </ng-container>

  <ng-container matColumnDef="latitude">
    <th mat-header-cell *matHeaderCellDef> Latitude </th>
    <td mat-cell *matCellDef="let element"> {{ element.latitude }} </td>
  </ng-container>

  <ng-container matColumnDef="longitude">
    <th mat-header-cell *matHeaderCellDef> Logitude </th>
    <td mat-cell *matCellDef="let element"> {{ element.longitude }} </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Ações </th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button color="warn" matTooltip="Localização no mapa">
        <mat-icon>travel_explore</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="viewDetails(element.id)"  matTooltip="Informações da máquina">
        <mat-icon>info</mat-icon>
      </button>
      <button mat-icon-button color="primary">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
