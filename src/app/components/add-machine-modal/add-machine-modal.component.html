<h2 mat-dialog-title>Adicionar Nova Máquina</h2>
<mat-dialog-content>
  <form [formGroup]="machineForm">
    <mat-form-field appearance="fill">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="name" placeholder="Ex: B224Z38" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Localização</mat-label>
      <input matInput formControlName="location" placeholder="Ex: Setor A - Galpão" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Latitude</mat-label>
      <input matInput formControlName="latitude" type="number" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Longitude</mat-label>
      <input matInput formControlName="longitude" type="number" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary" (click)="submit()">Salvar</button>
</mat-dialog-actions>
